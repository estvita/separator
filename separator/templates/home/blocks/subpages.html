{% load i18n wagtailcore_tags %}

{% if subpages %}
    <div class="subpages-block-container">
        <div class="subpages-block__header">
            <span class="subpages-block__header-spacer"></span>
            <button class="subpages-block__sort" type="button" data-sort-field="published">
                {% trans "Published" %}<span class="subpages-block__sort-indicator" aria-hidden="true">↕</span>
            </button>
            <button class="subpages-block__sort" type="button" data-sort-field="updated">
                {% trans "Updated" %}<span class="subpages-block__sort-indicator" aria-hidden="true">↕</span>
            </button>
        </div>
        <ul class="subpages-block">
            {% for item in subpages %}
                <li class="subpages-block__item"
                    style="--subpage-level: {{ item.level }};"
                    data-level="{{ item.level }}"
                    data-published="{{ item.page.first_published_at|date:'Y-m-d' }}"
                    data-updated="{{ item.page.last_published_at|date:'Y-m-d' }}">
                    <a class="subpages-block__link" href="{% pageurl item.page %}">
                        <span class="subpages-block__page">
                            <span class="subpages-block__icon" aria-hidden="true"></span>
                            <span class="subpages-block__title">{{ item.page.title }}</span>
                        </span>
                        <time class="subpages-block__date" datetime="{{ item.page.first_published_at|date:'Y-m-d' }}">
                            <span class="visually-hidden">{% trans "Published" %}: </span>
                            {{ item.page.first_published_at|date:"d.m.Y" }}
                        </time>
                        <time class="subpages-block__date" datetime="{{ item.page.last_published_at|date:'Y-m-d' }}">
                            <span class="visually-hidden">{% trans "Updated" %}: </span>
                            {{ item.page.last_published_at|date:"d.m.Y" }}
                        </time>
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
