{% extends "base.html" %}
{% load i18n %}
{% load static %}

{% block title %}
  User:
  {{ object.name }}
{% endblock title %}
{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <h2>{{ object.name }}</h2>
        <p>{{ object.email }}</p>
      </div>
    </div>
    {% if object == request.user %}
      {% include "users/_actions.html" %}
    {% endif %}
  </div>
{% endblock content %}
