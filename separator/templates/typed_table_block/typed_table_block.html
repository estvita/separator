{% load wagtailcore_tags %}

<div class="typed-table-block">
    <div class="typed-table-block__wrap">
        <table>
            {% if value.caption %}
                <caption>{{ value.caption }}</caption>
            {% endif %}
            <thead>
                <tr>
                    {% for col in value.columns %}
                        <th scope="col">{{ col.heading }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in value.rows %}
                    <tr>
                        {% for block in row %}
                            <td>{% include_block block %}</td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
